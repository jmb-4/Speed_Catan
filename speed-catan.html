<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Catan</title>
  <style>
    * { box-sizing: border-box; }

    /* ── Ember & Cream palette ──
       Ember:   deep red, main background
       Flare:   lighter red, background fade
       Cream:   light foreground — text, active timer, primary buttons
       Cocoa:   dark brown, card surface / accent
       Timer:   bright cream = running, dimmed cream = paused (no low-time color)
    */

    :root {
      --ember:       #901D2A;
      --flare:       #CA492D;
      --cream:       #ffEC96;
      --cream-dim:   rgba(255, 236, 150, 0.62);
      --cream-ghost: rgba(255, 236, 150, 0.22);
      --cocoa:       #44251a;
      --cocoa-2:     #2e1509;
      --ink:         #44251a;
      --white-piece-border: #e8dcc8;
    }

    body {
      margin: 0;
      padding: 24px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, var(--ember) 0%, var(--flare) 100%);
      background-attachment: fixed;
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--cocoa);
      border-radius: 22px;
      padding: 32px 26px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 236, 150, 0.08);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    h1 {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin: 0 0 26px;
      color: var(--cream);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h2 {
      font-size: 12px;
      font-weight: 700;
      margin: 0 0 12px;
      color: var(--cream-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--cream-dim);
      margin-bottom: 6px;
      font-weight: 500;
    }

    select,
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid rgba(255, 236, 150, 0.2);
      border-radius: 12px;
      background: var(--cocoa-2);
      color: var(--cream);
      margin-bottom: 16px;
      appearance: none;
    }

    select option {
      background: #fff;
      color: var(--ink);
    }

    select:focus,
    input[type="number"]:focus {
      border-color: var(--cream);
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 236, 150, 0.18);
    }

    button:focus-visible {
      outline: 2px solid var(--cream);
      outline-offset: 2px;
    }

    .player-colors {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .player-color-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-color-row span {
      font-size: 14px;
      color: var(--cream-dim);
      min-width: 90px;
    }

    .player-color-row select {
      flex: 1;
      margin-bottom: 0;
      padding: 8px 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.02em;
      transition: filter 0.2s, background 0.2s;
    }

    .btn-primary {
      background: var(--cream);
      color: var(--ink);
      box-shadow: 0 6px 20px rgba(255, 236, 150, 0.22);
    }

    .btn-primary:hover { filter: brightness(1.06); }

    .btn-primary:disabled {
      background: var(--cream);
      opacity: 0.35;
      box-shadow: none;
    }

    .btn-secondary {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(255, 236, 150, 0.35);
    }

    .btn-secondary:hover { background: rgba(255, 236, 150, 0.1); }

    .btn + .btn {
      margin-top: 10px;
    }

    /* ── Play screen ── */

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--cocoa-2);
      border-radius: 12px;
      border: 2px solid transparent;
      font-size: 14px;
      color: var(--cream-dim);
      transition: border-color 0.3s, background 0.3s, color 0.3s;
    }

    .player-info.active {
      border-color: var(--cream);
      background: rgba(255, 236, 150, 0.08);
      color: var(--cream);
      font-weight: 600;
    }

    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .player-name {
      flex: 1;
    }

    .phase-banner {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--cream);
      background: rgba(255, 236, 150, 0.1);
      border: 1px solid rgba(255, 236, 150, 0.25);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 16px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .timer-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .timer-num {
      font-size: 48px;
      font-weight: 800;
      min-width: 96px;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s, text-shadow 0.3s;
      color: var(--cream-dim);
    }

    .timer-num.running {
      color: var(--cream);
      text-shadow: 0 0 24px rgba(255, 236, 150, 0.5);
    }

    .bar-track {
      flex: 1;
      height: 14px;
      background: var(--cocoa-2);
      border-radius: 7px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    /* idle & paused: dimmed cream — only .running lights the bar up */
    .bar-fill {
      height: 100%;
      width: 100%;
      background: var(--cream-ghost);
      transition: width 1s linear, background 0.3s, box-shadow 0.3s;
    }

    .bar-fill.running {
      background: var(--cream);
      box-shadow: 0 0 12px rgba(255, 236, 150, 0.55);
    }

    .times-up {
      font-size: 26px;
      color: #fff;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.5; }
    }

    .play-buttons {
      display: flex;
      gap: 10px;
    }

    .play-buttons button {
      flex: 1;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.02em;
      transition: filter 0.2s, background 0.2s;
    }

    #playStartBtn {
      background: var(--cream);
      color: var(--ink);
      box-shadow: 0 6px 20px rgba(255, 236, 150, 0.22);
    }

    #playStartBtn:hover { filter: brightness(1.06); }

    #playStartBtn:disabled {
      background: var(--cream);
      opacity: 0.35;
      box-shadow: none;
    }

    #robberBtn {
      background: rgba(202, 73, 45, 0.3);
      color: var(--cream);
      border: 1px solid rgba(202, 73, 45, 0.65);
    }

    #robberBtn:hover { background: rgba(202, 73, 45, 0.45); }

    #nextBtn {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(255, 236, 150, 0.35);
      margin-top: 10px;
    }

    #nextBtn:hover { background: rgba(255, 236, 150, 0.1); }
  </style>
</head>
<body>
  <div class="card">

    <!-- ── Setup Screen ── -->
    <div id="setupScreen" class="screen active">
      <h1>Speed Catan</h1>

      <label for="playerCount">Anzahl Spieler</label>
      <select id="playerCount">
        <option value="2">2 Spieler</option>
        <option value="3">3 Spieler</option>
        <option value="4">4 Spieler</option>
        <option value="5">5 Spieler</option>
        <option value="6" selected>6 Spieler</option>
      </select>

      <h2>Spieler-Farben</h2>
      <div id="playerColorList" class="player-colors"></div>

      <label for="setupTime">Aufbauzeit pro Spieler (Sekunden)</label>
      <input type="number" id="setupTime" value="75" min="10" max="300" />

      <label for="actionTime">Aktionszeit pro Runde (Sekunden)</label>
      <input type="number" id="actionTime" value="45" min="10" max="300" />

      <button id="startBtn" class="btn btn-primary">Spiel starten</button>
    </div>

    <!-- ── Play Screen ── -->
    <div id="playScreen" class="screen">
      <h1>Speed Catan</h1>

      <div id="phaseBanner" class="phase-banner">Aufbauphase</div>

      <div id="playerList" class="player-list"></div>

      <div class="timer-row">
        <div id="timer" class="timer-num"></div>
        <div class="bar-track">
          <div id="bar" class="bar-fill"></div>
        </div>
      </div>

      <div class="play-buttons">
        <button id="playStartBtn">Start</button>
        <button id="robberBtn">Räuber (+15s)</button>
      </div>

      <button id="nextBtn" class="btn btn-secondary">Nächster Spieler</button>
      <button id="backBtn" class="btn btn-secondary">Neues Spiel</button>
    </div>

  </div>

  <script type="module" src="speed-catan.js"></script>
</body>
</html>
