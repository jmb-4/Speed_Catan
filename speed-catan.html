<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Catan</title>
  <style>
    * { box-sizing: border-box; }

    /* ── Catan color palette ──
       Ocean:     deep sea blue
       Parchment: board frame cream
       Brick:     hills red-orange
       Wood:      forest green
       Ore:       mountain gray
       Wheat:     fields gold
       Sheep:     pasture light green
       Desert:    sand
    */

    :root {
      --ocean:    #1a3a52;
      --ocean-2:  #234c6e;
      --parchment: #f5ecd6;
      --parchment-2: #ebe0c4;
      --ink:      #2b2018;
      --brick:    #c75b39;
      --wood:     #3d6b35;
      --ore:      #5a5a5a;
      --wheat:    #d4a843;
      --sheep:    #7ab33f;
      --desert:   #e8d5a0;
      --white-piece-border: #b8b8b8;
    }

    body {
      margin: 0;
      padding: 24px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, var(--ocean) 0%, var(--ocean-2) 100%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--parchment);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid var(--parchment-2);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    h1 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin: 0 0 24px;
      color: var(--ocean);
      letter-spacing: 0.02em;
    }

    h2 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 12px;
      color: var(--ore);
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--ore);
      margin-bottom: 6px;
      font-weight: 500;
    }

    select,
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--parchment-2);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      margin-bottom: 16px;
      appearance: none;
    }

    select:focus,
    input[type="number"]:focus {
      border-color: var(--wheat);
      outline: none;
      box-shadow: 0 0 0 2px rgba(212,168,67,0.3);
    }

    .player-colors {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .player-color-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-color-row span {
      font-size: 14px;
      color: var(--ore);
      min-width: 90px;
    }

    .player-color-row select {
      flex: 1;
      margin-bottom: 0;
      padding: 8px 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary {
      background: var(--brick);
      color: #fff;
    }

    .btn-primary:disabled {
      background: var(--ore);
      opacity: 0.5;
    }

    .btn-secondary {
      background: var(--desert);
      color: var(--ink);
      border: 1px solid var(--parchment-2);
    }

    .btn + .btn {
      margin-top: 10px;
    }

    /* ── Play screen ── */

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #fff;
      border-radius: 12px;
      border: 2px solid transparent;
      font-size: 14px;
      color: var(--ore);
    }

    .player-info.active {
      border-color: var(--wheat);
      background: #fdf6e3;
      color: var(--ink);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(212,168,67,0.3);
    }

    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .player-name {
      flex: 1;
    }

    .phase-banner {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: var(--ocean);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .timer-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .timer-num {
      font-size: 48px;
      font-weight: 700;
      min-width: 90px;
      transition: color 0.3s;
      color: var(--ink);
    }

    .timer-num.running {
      color: var(--wood);
    }

    .bar-track {
      flex: 1;
      height: 12px;
      background: var(--parchment-2);
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: var(--ocean);
      transition: width 1s linear, background 0.3s;
    }

    .bar-fill.running {
      background: var(--wood);
    }

    .bar-fill.low {
      background: var(--brick);
    }

    .bar-fill.paused {
      background: var(--ocean);
    }

    .times-up {
      color: var(--brick);
    }

    .play-buttons {
      display: flex;
      gap: 10px;
    }

    .play-buttons button {
      flex: 1;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #playStartBtn {
      background: var(--ink);
      color: #fff;
    }

    #playStartBtn:disabled {
      background: var(--ore);
      opacity: 0.5;
    }

    #robberBtn {
      background: var(--desert);
      color: var(--brick);
      border: 1px solid var(--brick);
    }

    #nextBtn {
      background: var(--desert);
      color: var(--ink);
      border: 1px solid var(--parchment-2);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- ── Setup Screen ── -->
    <div id="setupScreen" class="screen active">
      <h1>Speed Catan</h1>

      <label for="playerCount">Anzahl Spieler</label>
      <select id="playerCount">
        <option value="2">2 Spieler</option>
        <option value="3">3 Spieler</option>
        <option value="4">4 Spieler</option>
        <option value="5">5 Spieler</option>
        <option value="6" selected>6 Spieler</option>
      </select>

      <h2>Spieler-Farben</h2>
      <div id="playerColorList" class="player-colors"></div>

      <label for="setupTime">Aufbauzeit pro Spieler (Sekunden)</label>
      <input type="number" id="setupTime" value="75" min="10" max="300" />

      <label for="actionTime">Aktionszeit pro Runde (Sekunden)</label>
      <input type="number" id="actionTime" value="45" min="10" max="300" />

      <button id="startBtn" class="btn btn-primary">Spiel starten</button>
    </div>

    <!-- ── Play Screen ── -->
    <div id="playScreen" class="screen">
      <h1>Speed Catan</h1>

      <div id="phaseBanner" class="phase-banner">Aufbauphase</div>

      <div id="playerList" class="player-list"></div>

      <div class="timer-row">
        <div id="timer" class="timer-num"></div>
        <div class="bar-track">
          <div id="bar" class="bar-fill"></div>
        </div>
      </div>

      <div class="play-buttons">
        <button id="playStartBtn">Start</button>
        <button id="robberBtn">Räuber (+15s)</button>
      </div>

      <button id="nextBtn" class="btn btn-secondary">Nächster Spieler</button>
      <button id="backBtn" class="btn btn-secondary">Neues Spiel</button>
    </div>

  </div>

  <script type="module" src="speed-catan.js"></script>
</body>
</html>
